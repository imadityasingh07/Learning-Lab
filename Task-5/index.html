<!doctype html>
<html lang="en">
  <head>
    <title>Restaurant Order Form</title>
  </head>
  <body>
    <h2>Restaurant Order Form</h2>

    <form>
      <label>Customer Name:</label>
      <input type="text" name="customerName" />
      <br /><br />

      <label>Food Items:</label><br />
      <input type="checkbox" name="food" value="Idli" /> Idli<br />
      <input type="checkbox" name="food" value="Dosa" /> Dosa<br />
      <input type="checkbox" name="food" value="Rasam" /> Rasam<br />

      <br />

      <label>Quantity:</label>
      <input type="number" name="quantity" min="1" />
      <br /><br />

      <label>Address:</label>
      <input type="text" name="address" />
      <br /><br />

      <label>Payment Method:</label><br />
      <input type="radio" name="payment" value="Cash" /> Cash<br />
      <input type="radio" name="payment" value="Card" /> Card<br />
      <input type="radio" name="payment" value="UPI" /> UPI<br />

      <br />

      <button type="submit">Place Order</button>
    </form>
  </body>
</html>
